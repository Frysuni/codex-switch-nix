name: Update nixpkgs lock

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      force_check:
        description: Validate both platforms even when metadata is current
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      base: ${{ steps.changes.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0
      - name: Update nixpkgs input
        run: nix flake update nixpkgs
      - name: Detect changes
        id: changes
        env:
          FORCE_CHECK: ${{ inputs.force_check || false }}
        shell: bash
        run: |
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- flake.lock && [ "$FORCE_CHECK" != true ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changes.outputs.changed == 'true'
        with:
          name: candidate-lock
          path: |
            sources.json
            flake.lock
          retention-days: 1

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/validate.yml
    with:
      artifact: candidate-lock

  commit:
    needs: [prepare, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-lock
      - name: Commit tested lock refresh
        env:
          EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --cached --quiet; then
            echo "Validated metadata is already current; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update nixpkgs lock"
          git push origin HEAD:main
