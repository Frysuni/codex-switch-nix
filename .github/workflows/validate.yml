name: Validate packages

on:
  workflow_call:
    inputs:
      artifact:
        description: Optional candidate sources.json and flake.lock from maintenance
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: inputs.artifact != ''
        with:
          name: ${{ inputs.artifact }}
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0
      - name: Test updater
        run: python3 -m unittest discover -s tests -v
      - name: Verify pinned upstream archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify.py
      - name: Build, check version and evaluate NixOS module
        run: ./scripts/check.sh
